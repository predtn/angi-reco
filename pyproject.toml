[project]
name = "angi-reco"
version = "0.1.0"
description = "ANGI recommendation service (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20,<2",
    "fastapi>=0.142,<1",
    "pgvector>=0.5,<0.6",
    "psycopg[binary]>=3.3,<4",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "uvicorn[standard]>=0.54,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=9.1,<10",
    # Pinned: a new ruff release can change lint or format results and turn CI red.
    "ruff==0.16.10",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
# The alembic/ folder would otherwise make ruff treat the alembic package as first-party.
known-third-party = ["alembic"]
